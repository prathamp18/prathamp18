<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="DetourTO: a subway line closes, the agent re-plans a detour and verifies it">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7a7dff" stroke-opacity=".07"/></pattern>
<clipPath id="r"><rect width="1200" height="320" rx="18"/></clipPath>
</defs>
<style>
.m{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace} .s{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.35}}
.flow{stroke-dasharray:9 7;animation:f 1s linear infinite}@keyframes f{to{stroke-dashoffset:-16}}
.seq{opacity:0;animation:seq 10s infinite}
.q1{animation-delay:0s}.q2{animation-delay:1.4s}.q3{animation-delay:2.8s}.q4{animation-delay:4.2s}.q5{animation-delay:5.6s}
@keyframes seq{0%{opacity:0;transform:translateY(8px)}5%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}
</style>
<g clip-path="url(#r)">
<rect width="1200" height="320" fill="#07070b"/><rect width="1200" height="320" fill="url(#grid)"/>
<rect x=".75" y=".75" width="1198.5" height="318.5" rx="18" fill="none" stroke="#c4ff4d" stroke-opacity=".18"/>
<g transform="translate(40 10)" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M140 60 L140 200 L250 262 L360 200 L360 60" stroke="#f0c330" stroke-width="7"/>
<path d="M40 150 L600 150" stroke="#3fa45a" stroke-width="7"/>
<path d="M360 90 L470 90 L540 60" stroke="#a05ab4" stroke-width="7"/>
<path d="M140 70 L140 138" stroke="#ff6b5e" stroke-width="10" class="pulse"/>
<path d="M130 94 L150 114 M150 94 L130 114" stroke="#ff6b5e" stroke-width="3.5"/>
<path id="det" d="M140 60 L82 78 L72 118 L140 150" stroke="#c4ff4d" stroke-width="3.5" class="flow"/>

<circle cx="140" cy="60" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="140" cy="150" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="140" cy="200" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="250" cy="262" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="360" cy="200" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="360" cy="150" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="360" cy="90" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="360" cy="60" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="40" cy="150" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="600" cy="150" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="470" cy="90" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="540" cy="60" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="250" cy="150" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="480" cy="150" r="6" fill="#07070b" stroke="#ececf3" stroke-width="2.4"/>
<circle cx="140" cy="60" r="7" fill="#07070b" stroke="#c4ff4d" stroke-width="3"/><circle cx="140" cy="150" r="7" fill="#07070b" stroke="#c4ff4d" stroke-width="3"/>
<rect x="-9" y="-6" width="18" height="12" rx="3" fill="#c4ff4d"><animateMotion dur="3s" repeatCount="indefinite" path="M140 60 L82 78 L72 118 L140 150" rotate="auto"/></rect>
<g class="m" font-size="11" stroke="none">
<text x="160" y="104" fill="#ff6b5e">NO SERVICE</text>
<text x="0" y="104" fill="#c4ff4d" text-anchor="start">shuttle</text>
</g></g>
<g class="m" font-size="11"><circle cx="690" cy="36" r="4" fill="#c4ff4d" class="pulse"/><text x="702" y="40" fill="#c4ff4d" letter-spacing="2">DETOURTO · AGENT TRACE</text>
<text x="1168" y="40" text-anchor="end" fill="#9095a8">EECS 3311 · Java 21 · Claude on Bedrock</text></g>
<g class="seq q1"><rect x="690" y="78" width="478" height="36" rx="9" fill="#111120" stroke="#ececf3" stroke-opacity=".45"/><text x="704" y="101" class="m" font-size="11" font-weight="700" fill="#ececf3">RIDER</text><text x="762" y="101" class="m" font-size="12.5" fill="#ececf3">“York U by 10, no streetcars, step-free please”</text></g>
<g class="seq q2"><rect x="690" y="124" width="478" height="36" rx="9" fill="#111120" stroke="#ff6b5e" stroke-opacity=".45"/><text x="704" y="147" class="m" font-size="11" font-weight="700" fill="#ff6b5e">ALERT</text><text x="762" y="147" class="m" font-size="12.5" fill="#ececf3">GTFS-RT: Line 1 · no service · shuttle buses</text></g>
<g class="seq q3"><rect x="690" y="170" width="478" height="36" rx="9" fill="#111120" stroke="#7a7dff" stroke-opacity=".45"/><text x="704" y="193" class="m" font-size="11" font-weight="700" fill="#7a7dff">AGENT</text><text x="762" y="193" class="m" font-size="12.5" fill="#ececf3">tool → JourneyPlanner.plan(avoid = closure)</text></g>
<g class="seq q4"><rect x="690" y="216" width="478" height="36" rx="9" fill="#111120" stroke="#c4ff4d" stroke-opacity=".45"/><text x="704" y="239" class="m" font-size="11" font-weight="700" fill="#c4ff4d">CHECK</text><text x="762" y="239" class="m" font-size="12.5" fill="#ececf3">GroundingValidator ✓ every stop, route, time</text></g>
<g class="seq q5"><rect x="690" y="262" width="478" height="36" rx="9" fill="#111120" stroke="#c4ff4d" stroke-opacity=".45"/><text x="704" y="285" class="m" font-size="11" font-weight="700" fill="#c4ff4d">TRIP</text><text x="762" y="285" class="m" font-size="12.5" fill="#ececf3">re-planned itinerary + warning before departure</text></g>
<text x="330" y="304" text-anchor="middle" class="m" font-size="11" fill="#9095a8">the agent proposes · the Java planner verifies · nothing the rider sees comes from model text</text>
</g></svg>